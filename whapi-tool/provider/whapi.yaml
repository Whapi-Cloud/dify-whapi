identity:
  author: whapi-cloud
  name: whapi
  label:
    en_US: Whapi.Cloud
    zh_Hans: Whapi.Cloud
  description:
    en_US: WhatsApp API via https://gate.whapi.cloud only — send messages, check contacts, and custom API calls.
    zh_Hans: 仅通过 https://gate.whapi.cloud 使用 WhatsApp API — 发送消息、检查联系人及自定义 API 调用。
  icon: icon.svg
  tags:
    - social
credentials_for_provider:
  access_token:
    type: secret-input
    required: true
    label:
      en_US: Access Token
      zh_Hans: 访问令牌
    placeholder:
      en_US: Channel token from Whapi Panel
      zh_Hans: 来自 Whapi 面板的频道令牌
    help:
      en_US: Copy the token from https://panel.whapi.cloud/channels/{channel-id}
      zh_Hans: 从 Whapi 面板复制频道令牌
    url: https://panel.whapi.cloud/
  channel_id:
    type: text-input
    required: false
    label:
      en_US: Channel ID (optional)
      zh_Hans: 频道 ID（可选）
tools:
  - tools/message_send.yaml
  - tools/message_get.yaml
  - tools/contact_check.yaml
  - tools/api_request.yaml
extra:
  python:
    source: provider/whapi.py
