identity:
  name: api_request
  author: whapi-cloud
  label:
    en_US: Custom API Request
    zh_Hans: 自定义 API 请求
description:
  human:
    en_US: Call a Whapi API endpoint from the docs (https://whapi.cloud/docs). HTTP method and API path are set in the tool configuration (not by the model). POST, PUT, PATCH, and DELETE can create, change, or delete data in your WhatsApp channel.
    zh_Hans: 调用 Whapi 文档中的接口。HTTP 方法与路径在工具配置中设定（非模型自动选择）。POST、PUT、PATCH、DELETE 可能在频道中创建、修改或删除数据。
  llm: Run a preconfigured Whapi HTTP call. method and path are fixed in the tool node; only supply query_json/body_json when mapped from workflow context. GET reads data; POST/PUT/PATCH write; DELETE removes resources per Whapi API semantics.
parameters:
  - name: method
    type: select
    required: true
    default: GET
    form: form
    label:
      en_US: HTTP method
      zh_Hans: HTTP 方法
    human_description:
      en_US: GET reads data. POST, PUT, and PATCH create or update. DELETE removes messages or other resources — choose deliberately.
      zh_Hans: GET 读取；POST/PUT/PATCH 创建或更新；DELETE 删除消息等资源，请谨慎选择。
    options:
      - value: GET
        label:
          en_US: GET
      - value: POST
        label:
          en_US: POST
      - value: PUT
        label:
          en_US: PUT
      - value: PATCH
        label:
          en_US: PATCH
      - value: DELETE
        label:
          en_US: DELETE
  - name: path
    type: string
    required: true
    form: form
    label:
      en_US: API path
      zh_Hans: API 路径
    human_description:
      en_US: Path on gate.whapi.cloud starting with / (e.g. /limits). Set here in the workflow — the model must not choose arbitrary paths.
      zh_Hans: 以 / 开头的路径（如 /limits）。在工作流中配置，勿由模型随意指定路径。
  - name: query_json
    type: string
    required: false
    form: llm
    label:
      en_US: Query JSON
      zh_Hans: 查询参数 JSON
    human_description:
      en_US: Optional JSON object for URL query parameters
      zh_Hans: 可选的 URL 查询参数 JSON 对象
    llm_description: Optional JSON object for query string parameters
  - name: body_json
    type: string
    required: false
    form: llm
    label:
      en_US: Body JSON
      zh_Hans: 请求体 JSON
    human_description:
      en_US: Optional JSON object for request body on POST, PUT, PATCH
      zh_Hans: POST/PUT/PATCH 的可选 JSON 请求体
    llm_description: Optional JSON object request body for POST, PUT, PATCH
extra:
  python:
    source: tools/api_request.py
