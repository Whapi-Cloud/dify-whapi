identity:
  name: message_send
  author: whapi-cloud
  label:
    en_US: Send Message
    zh_Hans: 发送消息
description:
  human:
    en_US: Send a WhatsApp message (text or media) to a phone number or chat ID.
    zh_Hans: 向手机号或聊天 ID 发送 WhatsApp 消息（文本或媒体）。
  llm: Send a WhatsApp message via Whapi. Use recipient phone/chat ID without plus sign. For text set message_type=text and body. For media set message_type and media URL, ID, or base64.
output_schema:
  type: object
  properties:
    sent:
      type: boolean
    message_id:
      type: string
    chat_id:
      type: string
    status:
      type: string
    text_body:
      type: string
    from_me:
      type: boolean
    from:
      type: string
    message_type:
      type: string
    source:
      type: string
parameters:
  - name: to
    type: string
    required: true
    form: llm
    label:
      en_US: Recipient
      zh_Hans: 收件人
    human_description:
      en_US: Phone number or chat ID (no plus), e.g. 447911123456
      zh_Hans: 手机号或聊天 ID（不含加号）
    llm_description: Recipient phone number or Whapi chat_id from a webhook
  - name: message_type
    type: select
    required: true
    default: text
    form: llm
    label:
      en_US: Message type
      zh_Hans: 消息类型
    human_description:
      en_US: Type of message to send (text, image, video, audio, document, contact)
      zh_Hans: 要发送的消息类型
    llm_description: One of text, image, video, audio, document, contact
    options:
      - value: text
        label:
          en_US: Text
      - value: image
        label:
          en_US: Image
      - value: video
        label:
          en_US: Video
      - value: audio
        label:
          en_US: Audio
      - value: document
        label:
          en_US: Document
      - value: contact
        label:
          en_US: Contact
  - name: body
    type: string
    required: false
    form: llm
    label:
      en_US: Body
      zh_Hans: 正文
    human_description:
      en_US: Message text for text or contact types
      zh_Hans: 文本或联系人消息的正文
    llm_description: Text body for text or contact messages
  - name: media
    type: string
    required: false
    form: llm
    label:
      en_US: Media
      zh_Hans: 媒体
    human_description:
      en_US: URL, media ID, or base64 for media types
      zh_Hans: 媒体消息的 URL、媒体 ID 或 base64
    llm_description: URL, media ID, or base64 for image, video, audio, document
  - name: typing_time
    type: number
    required: false
    form: form
    label:
      en_US: Typing time (seconds)
      zh_Hans: 输入状态时长（秒）
    human_description:
      en_US: Seconds to show typing indicator (0-60)
      zh_Hans: 显示“正在输入”的秒数（0-60）
  - name: caption
    type: string
    required: false
    form: llm
    label:
      en_US: Caption
      zh_Hans: 说明文字
    human_description:
      en_US: Optional caption for image, video, or document
      zh_Hans: 图片、视频或文档的可选说明
    llm_description: Caption for media file
extra:
  python:
    source: tools/message_send.py
