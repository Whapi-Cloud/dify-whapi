identity:
  name: message_get
  author: whapi-cloud
  label:
    en_US: Get Message
    zh_Hans: 获取消息
description:
  human:
    en_US: Retrieve a WhatsApp message by its ID.
    zh_Hans: 根据 ID 获取 WhatsApp 消息。
  llm: Fetch a Whapi message by message ID.
output_schema:
  type: object
  properties:
    message_id:
      type: string
    chat_id:
      type: string
    status:
      type: string
    text_body:
      type: string
parameters:
  - name: message_id
    type: string
    required: true
    form: llm
    label:
      en_US: Message ID
      zh_Hans: 消息 ID
    human_description:
      en_US: Whapi message ID from send response or webhook
      zh_Hans: 来自发送响应或 webhook 的消息 ID
    llm_description: Message ID to fetch
extra:
  python:
    source: tools/message_get.py
