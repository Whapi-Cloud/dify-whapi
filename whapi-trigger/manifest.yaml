    - provider/whapi_trigger.yaml
network:
  domains:
    - gate.whapi.cloud
repo: https://github.com/Whapi-Cloud/dify-whapi
contact: care@whapi.cloud
meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
  minimum_dify_version: "1.10.0"
created_at: "2026-11-12T00:00:00.000000Z"
privacy: PRIVACY.md
