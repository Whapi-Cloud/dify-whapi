identity:
  name: whapi_trigger
  author: whapi-cloud
  label:
    en_US: Whapi Trigger
    zh_Hans: Whapi 触发器
  description:
    en_US: Whapi webhooks for messages and groups; channel API calls use https://gate.whapi.cloud only.
    zh_Hans: Whapi 消息与群组 webhook；频道 API 仅使用 https://gate.whapi.cloud。
  icon: icon.svg
  tags: []

subscription_constructor:
  credentials_schema:
    access_token:
      type: secret-input
      required: true
      label:
        en_US: Access Token
        zh_Hans: 访问令牌
      placeholder:
        en_US: Channel token from Whapi Panel
        zh_Hans: 来自 Whapi 面板的频道令牌
      url: https://panel.whapi.cloud/
  parameters:
    - name: event_families
      type: checkbox
      multiple: true
      required: true
      default:
        - messages
      label:
        en_US: Trigger on
        zh_Hans: 触发事件
      help:
        en_US: Subscribes to Whapi webhook events for all HTTP methods in the selected families.
        zh_Hans: 为所选事件类型订阅 Whapi webhook（对应 HTTP 方法）。
      options:
        - value: messages
          label:
            en_US: Messages events
            zh_Hans: 消息事件
        - value: groups
          label:
            en_US: Groups events
            zh_Hans: 群组事件

events:
  - events/whapi_messages.yaml
  - events/whapi_groups.yaml

extra:
  python:
    source: provider/whapi_trigger.py
