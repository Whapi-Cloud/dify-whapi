identity:
  name: whapi_trigger
  author: whapi-cloud
  label:
    en_US: Whapi Trigger
    zh_Hans: Whapi 触发器
  description:
    en_US: Receive Whapi webhook events for messages and groups.
    zh_Hans: 接收 Whapi 消息与群组 webhook 事件。
  icon: icon.svg
  tags: []

subscription_constructor:
  credentials_schema:
    access_token:
      type: secret-input
      required: true
      label:
        en_US: Access Token
        zh_Hans: 访问令牌
      placeholder:
        en_US: Channel token from Whapi Panel
        zh_Hans: 来自 Whapi 面板的频道令牌
      url: https://panel.whapi.cloud/
    api_base_url:
      type: text-input
      required: false
      default: https://gate.whapi.cloud
      label:
        en_US: API base URL
        zh_Hans: API 基础 URL
      help:
        en_US: Default and recommended — https://gate.whapi.cloud. Leave as default unless Whapi support gives you a different gateway URL.
        zh_Hans: 默认推荐 https://gate.whapi.cloud。除非 Whapi 支持另有说明，请保持默认。
  parameters:
    - name: event_families
      type: checkbox
      multiple: true
      required: true
      default:
        - messages
      label:
        en_US: Trigger on
        zh_Hans: 触发事件
      help:
        en_US: Subscribes to Whapi webhook events for all HTTP methods in the selected families.
        zh_Hans: 为所选事件类型订阅 Whapi webhook（对应 HTTP 方法）。
      options:
        - value: messages
          label:
            en_US: Messages events
            zh_Hans: 消息事件
        - value: groups
          label:
            en_US: Groups events
            zh_Hans: 群组事件

events:
  - events/whapi_messages.yaml
  - events/whapi_groups.yaml

extra:
  python:
    source: provider/whapi_trigger.py
